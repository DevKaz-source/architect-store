<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Architect Store avatar</title>
  <description id="description">Símbolo A luminoso da Architect Store sobre fundo tecnológico escuro</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050713"/>
      <stop offset="0.52" stop-color="#101637"/>
      <stop offset="1" stop-color="#071526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.48" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="48%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="0.62" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <circle cx="512" cy="500" r="430" fill="url(#halo)"/>
  <circle cx="512" cy="512" r="440" fill="none" stroke="#67e8f9" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="512" cy="512" r="394" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="2"/>

  <g filter="url(#glow)">
    <path d="M286 735L512 246L738 735" fill="none" stroke="url(#accent)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M397 579H627" fill="none" stroke="#f8fafc" stroke-width="44" stroke-linecap="round"/>
    <circle cx="512" cy="246" r="22" fill="#22d3ee"/>
    <circle cx="286" cy="735" r="22" fill="#8b5cf6"/>
    <circle cx="738" cy="735" r="22" fill="#a78bfa"/>
  </g>

  <g fill="#071526" stroke="#67e8f9" stroke-width="5" opacity="0.85">
    <circle cx="178" cy="333" r="13"/>
    <circle cx="832" cy="320" r="13"/>
    <circle cx="858" cy="673" r="13"/>
    <circle cx="169" cy="688" r="13"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.3">
    <path d="M178 333L284 390"/>
    <path d="M832 320L739 389"/>
    <path d="M858 673L756 641"/>
    <path d="M169 688L267 648"/>
  </g>
</svg>
