<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Boas-vindas à Architect Store</title>
  <description id="description">Cartão visual escuro da Architect Store para o bot no Telegram</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050713"/>
      <stop offset="0.54" stop-color="#111536"/>
      <stop offset="1" stop-color="#071b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx="35%" cy="48%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="42" fill="url(#background)"/>
  <rect width="1280" height="720" rx="42" fill="url(#grid)"/>
  <ellipse cx="390" cy="360" rx="430" ry="410" fill="url(#halo)"/>

  <g transform="translate(132 145)" filter="url(#glow)">
    <path d="M0 385L165 0L330 385" fill="none" stroke="url(#accent)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 238H252" fill="none" stroke="#f8fafc" stroke-width="27" stroke-linecap="round"/>
    <circle cx="165" cy="0" r="14" fill="#22d3ee"/>
    <circle cx="0" cy="385" r="14" fill="#8b5cf6"/>
    <circle cx="330" cy="385" r="14" fill="#a78bfa"/>
  </g>

  <g transform="translate(570 205)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="72" fill="#f8fafc" font-size="68" font-weight="800" letter-spacing="5">ARCHITECT</text>
    <text x="0" y="145" fill="#f8fafc" font-size="68" font-weight="800" letter-spacing="5">STORE</text>
    <text x="3" y="208" fill="#a5b4fc" font-size="26" font-weight="500" letter-spacing="2">PRODUTOS DIGITAIS</text>
    <text x="3" y="249" fill="#a5b4fc" font-size="26" font-weight="500" letter-spacing="2">ENTREGA AUTOMATIZADA</text>
    <g transform="translate(3 306)" font-size="18" font-weight="700">
      <rect x="0" y="0" width="150" height="46" rx="23" fill="#0891b2" fill-opacity="0.2" stroke="#22d3ee" stroke-opacity="0.8"/>
      <text x="75" y="30" text-anchor="middle" fill="#cffafe">PIX</text>
      <rect x="170" y="0" width="190" height="46" rx="23" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.8"/>
      <text x="265" y="30" text-anchor="middle" fill="#ede9fe">ENTREGA SEGURA</text>
    </g>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.42">
    <path d="M1016 120L1092 176L1170 129"/>
    <path d="M1000 586L1080 530L1182 586"/>
  </g>
  <g fill="#071526" stroke="#67e8f9" stroke-width="4">
    <circle cx="1016" cy="120" r="10"/>
    <circle cx="1092" cy="176" r="10"/>
    <circle cx="1170" cy="129" r="10"/>
    <circle cx="1000" cy="586" r="10"/>
    <circle cx="1080" cy="530" r="10"/>
    <circle cx="1182" cy="586" r="10"/>
  </g>
  <rect x="2" y="2" width="1276" height="716" rx="40" fill="none" stroke="#a78bfa" stroke-opacity="0.24" stroke-width="4"/>
</svg>
