[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-digital-store"
version = "0.4.0"
description = "Architect Store: produtos digitais no Telegram com Pix e fornecedores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.24,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=44,<48",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
store-admin = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
