name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target test --tag architect-store:test .

      - name: Run quality gate
        run: docker run --rm architect-store:test

  runtime-image:
    name: Runtime image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --target runtime --tag architect-store:runtime .
